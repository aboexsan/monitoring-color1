<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring Color — PT Astra Daihatsu Motor</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  /* ============ TOKENS ============ */
  :root{
    --brand:#0D3B66; --brand-dark:#082A4D; --brand-soft:#e8eef7;
    --amber:#f5a623; --amber-soft:#fdf3e0;
    --red:#C1121F; --red-soft:#fdeaea;
    --ink:#1f2a20; --ink-2:#5c6b5e; --ink-3:#8a988c;
    --bg:#f4f6f4; --card:#ffffff; --line:#e6ebe6;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#ffffff; overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
  }
  a{text-decoration:none;color:inherit}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}

  /* ============ STORAGE NOTE ============ */
  .storage-note{
    display:none; background:#fff8e1; border-bottom:1px solid #f0d98c;
    color:#7a5d00; font-size:13px; padding:9px 16px; text-align:center;
  }

  /* ============ TOPBAR ============ */
  .topbar{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50;}
  .topbar-inner{
    max-width:100%; margin:0; padding:10px 18px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:12px; flex-shrink:0; margin-right:auto;}
  .logo-badge{display:flex;align-items:center;justify-content:center;}
  .logo-badge img{width:64px; height:auto; border-radius:11px; box-shadow:0 3px 10px rgba(13,59,102,.28); display:block;}
  .logo-text{display:flex; flex-direction:column; line-height:1.22;}
  .logo-text .t2{font-weight:800; font-size:17px; color:var(--brand); letter-spacing:.5px;}
  .logo-text .t3{font-weight:800; font-size:12px; color:var(--red); letter-spacing:3.2px; margin-top:3px;}
  .searchbox{
    flex:1; min-width:220px; display:flex; align-items:center; gap:9px;
    background:#f2f5f2; border:1px solid var(--line); border-radius:10px; padding:9px 13px;
  }
  .searchbox input{border:none;outline:none;background:transparent;flex:1;font-size:14px;color:var(--ink)}
  .topnav{display:flex; gap:8px; flex-shrink:0;}
  .topnav a{
    font-size:13.5px; font-weight:600; color:var(--ink-2);
    padding:8px 14px; border-radius:9px; white-space:nowrap;
  }
  .topnav a:hover{background:var(--brand-soft); color:var(--brand-dark)}

  /* ============ LAYOUT ============ */
  main{max-width:1080px; margin:0 auto; padding:20px 18px 70px;}

  /* ============ BANNER ============ */
  .banner{
    background:linear-gradient(120deg,#082A4D 0%,#0D3B66 58%,#14406e 100%);
    border-bottom:5px solid var(--red);
    border-radius:18px; color:#fff; padding:24px 28px; margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    box-shadow:0 6px 18px rgba(13,59,102,.28);
  }
  .banner h1{font-size:21px; letter-spacing:-.2px; margin-bottom:4px;}
  .banner p{font-size:13.5px; opacity:.92;}
  .banner .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .banner .stat{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    border-radius:12px; padding:8px 16px; text-align:center; min-width:86px;
  }
  .banner .stat b{display:block; font-size:19px;}
  .banner .stat span{font-size:11.5px; opacity:.9;}

  /* ============ CHIPS ============ */
  .chips{display:flex; gap:8px; margin:0 0 18px; overflow-x:auto; padding-bottom:4px;}
  .chip{
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:7px 16px; font-size:13px; font-weight:600; color:var(--ink-2);
    white-space:nowrap; cursor:pointer; user-select:none;
  }
  .chip.on{background:var(--brand); border-color:var(--brand); color:#fff;}

  /* ============ GRID UNIT ============ */
  .grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:680px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:440px){.grid{grid-template-columns:1fr;}}
  .home-cta{display:flex; justify-content:center; margin-top:24px;}
  .home-cta .btn-teal{display:inline-block; text-decoration:none; font-size:15px; padding:14px 44px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; transition:.18s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(31,42,32,.10);}
  .card-img{position:relative; aspect-ratio:4/3; background:#eef1ee; overflow:hidden;}
  .card-img img{width:100%; height:100%; object-fit:cover;}
  .flag{
    position:absolute; top:10px; left:10px; background:var(--brand); color:#fff;
    font-size:10.5px; font-weight:800; letter-spacing:.6px; padding:4px 9px; border-radius:7px;
  }
  .card-body{padding:13px 15px 15px; display:flex; flex-direction:column; gap:7px; flex:1;}
  .card-title{font-weight:700; font-size:14.5px; line-height:1.35;}
  .card-price{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card-price b{font-size:15px; color:var(--ink);}
  .dots{display:flex; gap:4px;}
  .dot{width:16px;height:16px;border-radius:50%;display:inline-block;}
  .card-meta{font-size:12.5px; color:var(--ink-3);}
  .card-meta .star{color:#f5b100; font-weight:700;}
  .mini-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto;}
  .mb{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;}

  /* ============ STATUS ============ */
  .s-ok{background:var(--brand-soft); color:var(--brand-dark);}
  .s-cek{background:var(--amber-soft); color:#9a6b00;}
  .s-re{background:var(--red-soft); color:var(--red);}
  .s-todo{background:var(--red-soft); color:var(--red);}

  /* ============ DETAIL ============ */
  .back{display:inline-block; font-size:13.5px; font-weight:600; color:var(--ink-2); margin-bottom:14px;}
  .back:hover{color:var(--brand-dark)}
  .detail{
    background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden;
    display:flex; margin-bottom:24px;
  }
  .detail-img{width:46%; min-width:280px; background:#eef1ee;}
  .detail-img img{width:100%; height:100%; object-fit:cover; min-height:260px;}
  .detail-info{padding:24px 26px; flex:1; display:flex; flex-direction:column; gap:9px;}
  .unit-flag{
    align-self:flex-start; background:var(--brand); color:#fff; font-size:10.5px;
    font-weight:800; letter-spacing:.8px; padding:4px 10px; border-radius:7px;
  }
  .detail-info h1{font-size:23px; letter-spacing:-.3px; line-height:1.25;}
  .detail-meta{font-size:13.5px; color:var(--ink-2);}
  .detail-stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .dstat{
    border:1px solid var(--line); border-radius:12px; padding:8px 14px; text-align:center; min-width:74px;
  }
  .dstat b{display:block; font-size:17px;}
  .dstat span{font-size:11px; color:var(--ink-3);}
  .btn{
    background:var(--brand); color:#fff; border:none; border-radius:10px;
    padding:11px 20px; font-size:14px; font-weight:700; align-self:flex-start;
    box-shadow:0 3px 10px rgba(13,59,102,.3);
  }
  .btn:hover{background:var(--brand-dark)}
  .btn.ghost{background:#fff; color:var(--ink-2); border:1px solid var(--line); box-shadow:none;}
  .btn.ghost:hover{background:#f4f6f4}

  h2.sect{font-size:17px; margin:0 0 14px;}

  /* ============ KARTU WARNA ============ */
  .warna-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:14px;}
  .warna-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:8px;
  }
  .swatch{min-height:132px; border-radius:10px; border:1px solid rgba(0,0,0,.10); position:relative; overflow:hidden; display:flex; align-items:flex-end;}
  .swt{width:100%; font-size:9px; line-height:1.45; padding:5px 8px 6px;}
  .swt.lt{background:rgba(255,255,255,.87); color:#1a2630;}
  .swt.dk{background:rgba(9,13,18,.66); color:#ffffff;}
  .swt-t{font-size:7.6px; font-weight:800; letter-spacing:1.6px; opacity:.8; margin-bottom:2px;}
  .swt table{width:100%; border-collapse:collapse;}
  .swt th{font-weight:800; padding:0 2px 1px; text-align:center;}
  .swt td{padding:1px 2px; text-align:center; font-weight:600;}
  .swt td.swt-l{text-align:left; font-weight:800; width:22px;}
  .swt td.swt-e{text-align:left; font-weight:700; opacity:.92;}
  .swatch::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 55%);
  }
  .warna-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .warna-head b{font-size:14.5px;}
  .kode{font-size:11.5px; color:var(--ink-3); font-family:ui-monospace,Menlo,Consolas,monospace;}
  .status{align-self:flex-start; font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:999px; letter-spacing:.3px;}
  .tanggal{font-size:12px; color:var(--ink-3);}
  .catatan{
    font-size:12.5px; color:var(--ink-2); background:#f7f8f7;
    border-left:3px solid var(--line); padding:7px 10px; border-radius:0 8px 8px 0;
  }
  .row{display:flex; gap:8px; margin-top:auto; padding-top:4px;}
  .mini{
    flex:1; background:#f4f6f4; border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; font-size:12.5px; font-weight:600; color:var(--ink-2);
  }
  .mini:hover{background:#eaeeea}
  .mini.danger:hover{background:var(--red-soft); color:var(--red); border-color:#f3c1c3;}
  .mini.armed{background:var(--red-soft); color:var(--red); border-color:var(--red);}
  .add-card{
    border:2px dashed #c9d4ca; border-radius:var(--radius); background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    min-height:190px; color:var(--ink-3); font-weight:600; font-size:14px; cursor:pointer;
  }
  .add-card:hover{border-color:var(--brand); color:var(--brand-dark); background:var(--brand-soft);}
  .add-card .plus{font-size:30px; line-height:1;}
  .empty-note{
    grid-column:1/-1; text-align:center; color:var(--ink-3); font-size:14px;
    background:#fff; border:1px dashed var(--line); border-radius:var(--radius); padding:30px;
  }

  /* ============ REKAP ============ */
  .rekap-head{
    background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:20px 24px; margin-bottom:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .rekap-head .big{font-size:26px; font-weight:800; letter-spacing:-.4px;}
  .rekap-row{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  }
  .rekap-thumb{width:74px; height:56px; border-radius:10px; object-fit:cover; background:#eef1ee;}
  .rekap-info{flex:1; min-width:190px;}
  .rekap-info b{font-size:14.5px;}
  .rekap-info div{font-size:12px; color:var(--ink-3); margin-top:2px;}
  .rekap-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .bar{width:130px; height:8px; background:#eef1ee; border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--brand); border-radius:99px;}

  /* ============ CARA PAKAI ============ */
  .steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-bottom:20px;}
  .step{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  }
  .step .n{
    width:28px; height:28px; border-radius:9px; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; margin-bottom:10px;
  }
  .step h3{font-size:15px; margin-bottom:5px;}
  .step p{font-size:13px; color:var(--ink-2);}
  .io-panel{background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px 24px;}
  .io-panel h3{font-size:15px; margin-bottom:8px;}
  .io-panel p{font-size:13px; color:var(--ink-2); margin-bottom:12px;}


  /* ============ FORM INPUT UKUR ============ */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(31,42,32,.06);}
  .fm-bar{background:#1cc3c9;display:flex;flex-wrap:wrap;gap:10px 18px;padding:12px 18px;color:#073a3f;font-size:13px;font-weight:700;align-items:center;}
  .fm-f{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .fm-f select,.fm-f input{border:1px solid #0e8f95;border-radius:6px;padding:5px 7px;font-size:13px;font-weight:600;color:#073a3f;background:#fff;outline:none;}
  .fm-f input[type=text]{width:110px;}
  .fm-tablewrap{overflow-x:auto;}
  .fm-table{border-collapse:collapse;width:100%;min-width:840px;}
  .fm-table th,.fm-table td{border:1px solid #c9ced3;padding:6px 5px;text-align:center;font-size:12.5px;}
  .fm-table thead th{background:#e9ecef;color:#20262b;font-weight:800;}
  .fm-table .rowlab{background:#f3f5f6;text-align:left;padding:8px 14px;font-weight:800;color:#20262b;white-space:nowrap;width:150px;}
  .fm-table td input{width:56px;padding:6px 4px;border:1px solid #c9ced3;border-radius:5px;text-align:center;font-size:12.5px;color:var(--ink);font-family:inherit;}
  .fm-table td input:focus{outline:none;border-color:#1cc3c9;box-shadow:0 0 0 2px rgba(28,195,201,.25);}
  .fm-table td input.bad{border-color:var(--red);background:var(--red-soft);}
  .fm-table td input.inp-ng{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:800;}
  .std-panel{display:flex;gap:14px;align-items:stretch;padding:14px 18px;border-top:1px dashed var(--line);flex-wrap:wrap;background:#fbfcfb;}
  .std-swatch{
    width:240px; min-height:150px; border-radius:12px; border:1px solid rgba(0,0,0,.12);
    display:flex; align-items:flex-end; overflow:hidden; position:relative;
  }
  .fm-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;background:#f7f8f9;border-top:1px solid var(--line);flex-wrap:wrap;}
  .fm-note{font-size:12px;color:#5a6570;}
  .btn-teal{background:#1cc3c9;color:#fff;border:none;border-radius:9px;padding:12px 34px;font-size:14px;font-weight:800;letter-spacing:.5px;box-shadow:0 3px 10px rgba(28,195,201,.35);cursor:pointer;}
  .btn-teal:hover{background:#14a9af;}
  .nav-cta{background:var(--red)!important;color:#fff!important;}
  .nav-cta:hover{background:#96101a!important;}
  .ukur{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .ukur summary{padding:12px 16px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none;}
  .ukur summary::before{content:'▸';display:inline-block;width:18px;height:18px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
  .ukur[open] summary::before{content:'▾';background:var(--red);}
  .ukur[open]{border-color:var(--brand);box-shadow:0 2px 8px rgba(13,59,102,.08);}
  .ukur summary::-webkit-details-marker{display:none;}
  .ukur summary:hover{background:#f7f8f7;}
  .ukur .de-ok{color:var(--brand-dark);} .ukur .de-bad{color:var(--red);}
  .ukur table{border-collapse:collapse;width:100%;min-width:780px;font-size:11.5px;}
  .ukur th,.ukur td{border:1px solid #dfe3e6;padding:4px 6px;text-align:center;}
  .ukur thead th{background:#e9ecef;}
  .ukur .rowlab{text-align:left;font-weight:700;background:#f3f5f6;white-space:nowrap;}
  .ukur .inner{padding:10px 14px 14px;overflow-x:auto;}
  .ukur .delbtn{margin-left:auto;}
  .ukt{border-collapse:collapse;width:100%;min-width:780px;font-size:11.5px;}
  .ukt th,.ukt td{border:1px solid #b7c2b7;padding:4px 6px;text-align:center;}
  .ukt-lab{background:#eef1ee;color:#1f2a20;font-weight:800;text-align:left;padding-left:12px!important;white-space:nowrap;letter-spacing:1px;border-bottom:2px solid #9aa89a;}
  .ukt-metric{color:#fff;font-weight:800;font-size:12px;letter-spacing:.5px;}
  .ukt-ang{background:#f2f4ee;color:#1f2a20;font-weight:700;font-size:10px;}
  .ukt-part{background:#eef2ea;color:#1f2a20;font-weight:700;text-align:left;padding-left:12px!important;white-space:nowrap;text-transform:uppercase;}
  .ukt-target td{
    background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 45%,#90caf9 100%);
    color:#0d47a1; font-weight:700;
  }
  .ukt-target .ukt-part{
    background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 45%,#90caf9 100%);
    color:#0d47a1; font-weight:800;
  }
  .c-ok{background:#e7f3e8;color:#1e6b24;}
  .c-ng{background:var(--red-soft);color:var(--red);font-weight:800;}
  .legend-note{font-size:11.5px;color:#5a6570;margin-top:8px;}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:10px;}
  .chart-cell svg{width:100%;border:1px solid #E2E8F0;border-radius:12px;display:block;box-shadow:0 1px 4px rgba(15,23,42,.06);}
  .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5a6570;margin-top:6px;}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .ss-wrap{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .ss-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);}
  .ss-head h3{font-size:15px;}
  .ss-btns{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .ss-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#f7f8f7;font-size:15px;cursor:pointer;color:var(--ink);}
  .ss-btn:hover{background:var(--brand-soft);}
  .ss-count{font-size:12.5px;font-weight:700;color:var(--ink-2);min-width:44px;text-align:center;}
  .ss-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px 0;}
  .ss-badge{font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:999px;}
  .ss-box{padding:6px 18px 16px;}
  .ss-dots{display:flex;gap:5px;padding:0 18px 14px;flex-wrap:wrap;}
  .ss-dot{width:9px;height:9px;border-radius:50%;background:#d7ded7;cursor:pointer;border:none;padding:0;}
  .ss-dot.on{background:var(--brand);transform:scale(1.25);}
  .ukur-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;margin-bottom:12px;}
  .ukur-head h2{margin:0;}
  .dl-btn{
    margin-left:auto; display:inline-flex; align-items:center; gap:8px;
    background:#1e7e3c; color:#fff; border:none; border-radius:10px;
    padding:10px 18px; font-size:13px; font-weight:800; cursor:pointer;
    box-shadow:0 3px 10px rgba(30,126,60,.3);
  }
  .dl-btn:hover{background:#166530;}
  .dl-btn svg{width:16px;height:16px;}
  .uk-chk{width:16px;height:16px;accent-color:#1e7e3c;cursor:pointer;flex-shrink:0;margin-right:2px;}
  .uk-all{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;}
  .uk-all input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;}
  .ukur-filter{margin:-6px 0 12px;font-size:13px;}
  .ukur-filter select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:13px;background:#fff;}

  /* ============ MODAL ============ */
  .modal-wrap{
    position:fixed; inset:0; background:rgba(20,28,21,.5); z-index:100;
    display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto;
  }
  .modal-wrap.open{display:flex;}
  .modal{
    background:#fff; border-radius:18px; width:100%; max-width:430px; padding:24px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.25); animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.96); opacity:0} to{transform:scale(1); opacity:1}}
  .modal h3{font-size:18px; margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-2); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:14px; font-family:inherit; color:var(--ink); background:#fbfcfb; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand); background:#fff;}
  .hex-row{display:flex; align-items:center; gap:10px;}
  .hex-row input[type=color]{width:52px; height:40px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:3px; cursor:pointer;}
  .hex-row span{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink-2);}
  .modal-btns{display:flex; gap:10px; margin-top:20px;}
  .modal-btns .btn{flex:1; align-self:auto; text-align:center;}
  .modal-btns .btn.ghost{flex:0 0 110px;}

  /* ============ TOAST ============ */
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
    padding:11px 22px; border-radius:99px; opacity:0; transition:.25s; z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.25); pointer-events:none; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);}

    background-size:cover; background-position:center center; background-repeat:no-repeat;
  }
  .login-wrap::before{
    content:''; position:absolute; inset:0;
    background:rgba(255,255,255,.62);
  }
  .login-card{position:relative; z-index:2;}
  .login-card{
    background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.6);border-radius:20px;
    width:100%;max-width:400px;padding:34px 34px 30px;
    box-shadow:0 8px 30px rgba(13,59,102,.18);text-align:center;
    backdrop-filter:blur(4px);
  }
  .login-card img{width:74px;margin:0 auto 14px;border-radius:12px;display:block;}
  .login-card .lc1{font-weight:800;color:var(--brand);font-size:15px;letter-spacing:.5px;}
  .login-card .lc2{font-weight:800;color:var(--red);font-size:9px;letter-spacing:2.6px;margin:3px 0 20px;}
  .login-card h1{font-size:19px;margin-bottom:4px;}
  .login-card p{font-size:12.5px;color:var(--ink-3);margin-bottom:20px;}
  .lg-field{margin-bottom:12px;text-align:left;}
  .lg-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px;}
  .lg-field input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:14px;font-family:inherit;outline:none;background:#fbfcfb;
  }
  .lg-field input:focus{border-color:var(--brand);background:#fff;}
  .lg-err{display:none;background:var(--red-soft);color:var(--red);font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 12px;margin-bottom:12px;}
  .lg-err.show{display:block;}
  .lg-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(13,59,102,.3);}
  .lg-btn:hover{background:var(--brand-dark);}
  .lg-wa{
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none; border:1px solid #cfe8d6; background:#f2fbf5; color:#1e7e3c;
    border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:700;
  }
  .lg-wa:hover{background:#e6f7ec;}
  .lg-wa svg{width:16px; height:16px; flex-shrink:0;}

  /* ============ USERBOX ============ */
  .userbox{margin-left:auto;display:flex;align-items:center;gap:9px;}
  .userbox .ub-id{font-size:13px;font-weight:800;color:var(--brand);}
  .userbox .ub-role{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .ub-admin{background:var(--amber-soft);color:#9a6b00;}
  .ub-op{background:var(--brand-soft);color:var(--brand);}
  .ub-out{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;}
  .ub-out:hover{background:var(--red-soft);color:var(--red);border-color:#f3c1c3;}

  footer{
    display:none;
  }
  .login-footer{
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    background:linear-gradient(90deg,#082A4D 0%,#0D3B66 45%,#14406e 72%,#1CC3C9 100%);
    color:#eaf2fb; text-align:center;
    padding:10px 16px; font-size:12px; font-weight:600; letter-spacing:.4px;
  }
  .login-footer .c1{font-weight:800; letter-spacing:.6px;}
  .login-footer .c2{margin-left:10px; opacity:.95;}
  .login-footer .mail{color:#ffd9a0; text-decoration:none; margin-left:10px;}
  .login-footer .mail:hover{text-decoration:underline;}

  @media (max-width:720px){
    .detail{flex-direction:column;}
    .detail-img{width:100%; min-width:0;}
    .detail-img img{max-height:240px; min-height:0;}
    .banner{padding:20px;}
    .topnav a{padding:8px 10px;}
  }
</style>
</head>

// ---------- USERS & SESSION ----------
let SESSION = null;
function isAdmin(){ return !!SESSION && SESSION.role==='admin'; }
function requireAdmin(){
  if(!isAdmin()){ toast('Fitur ini khusus admin — akun operator hanya bisa input data', false); return false; }
  return true;
}
async function doLogin(){
  const id  = $('#lgId').value.trim();
  const pw  = $('#lgPw').value;
  try{
    const j = await api('POST','/api/login',{id, pw});
    SESSION = j.user; DB = j.db;
    location.hash = '#/home';
    render();
    toast('Masuk sebagai '+SESSION.id+' ('+(SESSION.role==='admin'?'Admin':'Operator')+') ✓');
  }catch(e){
    $('#lgErr').textContent = e.message || 'Login gagal';
    $('#lgErr').classList.add('show');
  }
}
async function doLogout(){
  try{ await api('POST','/api/logout',{}); }catch(e){}
  SESSION = null; DB = null;
  location.hash = '#/home';
  render();
}
function renderUserbox(){
  const ub = $('#userbox');
  if(!ub) return;
  if(!SESSION){ ub.innerHTML=''; return; }
  const admin = SESSION.role==='admin';
  ub.innerHTML = `<span class="ub-id">👤 ${esc(SESSION.id)}</span>
    <span class="ub-role ${admin?'ub-admin':'ub-op'}">${admin?'ADMIN':'OPERATOR'}</span>
    <button class="ub-out" onclick="doLogout()">Keluar</button>`;
}

// ---------- STATE ----------
let DB = null;
let editCtx = null;   // {unitId, warnaId|null}
let delArm = null;    // id tombol hapus yang sudah "di armed"

// ---------- UTIL ----------
const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function statusCls(st){
  return (st==='OK' || st==='Checked') ? 's-ok' : (st==='Perlu Cek' ? 's-cek' : 's-todo');
}
function fmtUpdated(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg, ok=true){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (ok ? '' : ' err');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=> t.className = 'toast', 2200);
}

// ---------- ROUTER ----------
window.addEventListener('hashchange', render);
function render(){
  renderUserbox();
  const tb = document.querySelector('.topbar');
  if(tb){ tb.style.background = ''; tb.style.borderBottom = ''; }
  if(SESSION && DB){
    const lf = document.getElementById('loginFooter');
    if(lf) lf.remove();
  }
  if(!SESSION || !DB){ renderLogin(); return; }
  const h = location.hash || '#/home';
  closeModal();
  if(h.startsWith('#/unit/')) renderDetail(h.split('/')[2]);
  else if(h === '#/input') renderInput();
  else renderHome();
  window.scrollTo(0,0);
}

      <a href="#/input" class="btn-teal">＋ Input Data</a>

    <div class="ss-wrap">
      <div class="ss-head">
        <h3>📈 Trend Color Chart</h3>
        <div class="ss-btns">
          <button class="ss-btn" onclick="ssPrev()" title="Sebelumnya">‹</button>

function renderHomeGrid(){
  const grid = $('#unitGrid');
  if(!grid) return;
  grid.innerHTML = DB.units.map(unitCard).join('');
}

function unitCard(u){
  const cek = u.warna.filter(w=>w.status==='Perlu Cek').length;
  const bd  = u.warna.filter(w=>w.status==='N/Y Check').length;
  const dots = u.warna.slice(0,6).map(w=>
    `<span class="dot" style="background:${esc(w.hex)}"></span>`).join('');
  const badges = [
    bd  ? `<span class="mb s-ok">Check Update Data Disini</span>` : '',
    cek ? `<span class="mb s-cek">${cek} perlu cek</span>` : '',
    (!bd && !cek && u.warna.length) ? `<span class="mb s-ok">Semua Checked ✓</span>` : ''
  ].join('');
  return `
  <a class="card" href="#/unit/${u.id}">
    <div class="card-img">
      <img src="${u.img}" alt="${esc(u.nama)}">
    </div>
    <div class="card-body">
      <div class="card-title">${esc(u.nama)}</div>
      <div class="card-price">
        <b>${u.warna.length} Warna</b>
        <span class="dots">${dots || '<span style="font-size:11px;color:#8a988c">belum diisi</span>'}</span>
      </div>
      <div class="card-meta"><span class="star">${esc(u.kode||'')}</span> • ${esc(u.lokasi)}</div>
      <div class="mini-badges">${badges}</div>
    </div>
  </a>`;
}

// ---------- HALAMAN: DETAIL UNIT ----------
function renderDetail(id){
  const u = DB.units.find(x=>x.id===id);
  if(!u){ location.hash = '#/home'; return; }

  const ok  = u.warna.filter(w=>w.status==='OK' || w.status==='Checked').length;
  const cek = u.warna.filter(w=>w.status==='Perlu Cek').length;
  const bd  = u.warna.filter(w=>w.status==='N/Y Check').length;

  $('#app').innerHTML = `
    <a class="back" href="#/home">← Kembali ke katalog</a>
    <div class="detail">
      <div class="detail-img"><img src="${u.img}" alt="${esc(u.nama)}"></div>
      <div class="detail-info">
        <h1>${esc(u.nama)}</h1>
        <div class="detail-meta">Unit: <b>${esc(u.kode||'—')}</b> &nbsp;•&nbsp; Lokasi: <b>${esc(u.lokasi)}</b></div>
        <div class="detail-meta">Terakhir update: <b>${fmtUpdated(u.updated)}</b></div>
        <div class="detail-stats">
          <div class="dstat"><b>${u.warna.length}</b><span>Total Warna</span></div>
          <div class="dstat" style="color:var(--brand-dark)"><b>${ok}</b><span>Checked</span></div>
          <div class="dstat" style="color:#9a6b00"><b>${cek}</b><span>Perlu Cek</span></div>
          <div class="dstat" style="color:var(--red)"><b>${bd}</b><span>N/Y Check</span></div>
        </div>
        ${isAdmin()?`<button class="btn" onclick="openForm('${u.id}')">+ Tambah Warna</button>`:''}
      </div>
    </div>
    <h2 class="sect">Daftar Warna (${u.warna.length})</h2>
    <div class="warna-grid">
      ${u.warna.length ? u.warna.map(w=>warnaCard(u,w)).join('') : ''}
      <div class="add-card" onclick="openForm('${u.id}')">
        <span class="plus">＋</span>
        ${u.warna.length ? 'Tambah warna baru' : 'Belum ada data warna.<br>Klik di sini untuk mulai mengisi'}
      </div>
    </div>
    ${ukurSection(u.id)}
  `;
}

function swatchTargetHTML(kode){
  const t = TARGETS[kode];
  if(!t) return '';
  const light = hexLum(kode ? (KODE_WARNA.find(k=>k.kode===kode)||{}).hex || '#888888' : '#888888') > 140;
  const f = v => (+v).toFixed(1);
  const rg = b => `${f(b[0])}~${f(b[1])}`;
  const row = (label,key) => `<tr><td class="swt-l">${label}</td>${[0,1,2].map(a=>`<td>${rg(t[key][a])}</td>`).join('')}</tr>`;
  return `<div class="swt ${light?'lt':'dk'}" title="Standard ADM warna ${kode}">

async function delWarna(unitId, warnaId){

  if(delArm !== warnaId){

    btn.textContent = '⚠ Yakin hapus?';

function boundsOf(kode, m, a){
  if(m==='dE') return [-DE_MAX, DE_MAX];
  const t = TARGETS[kode];
  return (t && t[m]) ? t[m][a] : null;
}
function hexLum(hex){
  const h = String(hex).replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 0.299*r + 0.587*g + 0.114*b;
}
function hexLum(hex){
  const h = String(hex).replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 0.299*r + 0.587*g + 0.114*b;
}
function hitungNG(rec){
  const out = [];
  Object.keys(rec.rows).forEach(r=>{
    METRICS.forEach(([m])=>{
      rec.rows[r][m].forEach((v,a)=>{
        const b = boundsOf(rec.kode, m, a);
        if(b && !isNaN(v) && (v < b[0] || v > b[1]))
          out.push({row:r, m, a, label:`${r} ${({dL:'ΔL',da:'Δa',db:'Δb',dE:'ΔE'})[m]}${ANGLES[a]}`});
      });
    });
  });
  return out;
}

// ---------- SLIDESHOW grafik hasil pengecekan ----------
let ssIdx = 0, ssTimer = null, ssPlaying = true;
function ssRecords(){
  return DB.measurements.slice();
}
function ssStart(){
  ssStopTimer();
  const recs = ssRecords();
  if(ssIdx >= recs.length) ssIdx = 0;
  ssRender();
  if(recs.length > 1 && ssPlaying){
    ssTimer = setInterval(()=>{ ssIdx = (ssIdx+1) % ssRecords().length; ssRender(); }, 5000);
    const b = $('#ssPlayBtn'); if(b) b.textContent = '⏸';
  } else {
    const b = $('#ssPlayBtn'); if(b) b.textContent = '▶';
  }
}
function ssStopTimer(){ if(ssTimer){ clearInterval(ssTimer); ssTimer = null; } }
function ssRender(){
  const recs = ssRecords();
  const box = $('#ssBox');
  if(!box) return;
  if(!recs.length){
    $('#ssMeta').innerHTML = '';
    $('#ssDots').innerHTML = '';
    $('#ssCount').textContent = '';
    box.innerHTML = `<div class="empty-note" style="margin-bottom:0">Belum ada data pengukuran — slideshow akan terisi otomatis setelah ada input.</div>`;
    return;
  }
  const r = recs[ssIdx];
  const u = DB.units.find(x=>x.id===r.unitId) || {kode:'?', nama:'?'};

  const okAll = !ngs.length;

    <span class="ss-badge ${okAll?'s-ok':'s-cek'}" style="margin-left:auto">${okAll ? 'Over All OK ✓' : '⚠ ' + ngs.map(n=>`${n.row} ${({dL:'ΔL',da:'Δa',db:'Δb',dE:'ΔE'})[n.m]}${ANGLES[n.a]} NG`).join(' • ')}</span>`;
  box.innerHTML = chartHTML(r);
  $('#ssDots').innerHTML = recs.map((_,i)=>`<button class="ss-dot ${i===ssIdx?'on':''}" onclick="ssGo(${i})" title="Record ${i+1}"></button>`).join('');
}
function ssNext(){ ssStopTimer(); const n = ssRecords().length; if(n){ ssIdx=(ssIdx+1)%n; ssRender(); } ssStart(); }
function ssPrev(){ ssStopTimer(); const n = ssRecords().length; if(n){ ssIdx=(ssIdx-1+n)%n; ssRender(); } ssStart(); }
function ssGo(i){ ssStopTimer(); ssIdx=i; ssRender(); ssStart(); }
function ssToggle(){
  ssPlaying = !ssPlaying;

}

function liveNg(inp){

  const b = boundsOf(kode, m, a);
  inp.classList.remove('inp-ng');
  const v = parseFloat(inp.value);
  if(b && inp.value.trim()!=='' && !isNaN(v) && (v < b[0] || v > b[1]))
    inp.classList.add('inp-ng');
}

  $('#ukurBody').querySelectorAll('input').forEach(liveNg);
}

// navigasi keyboard: panah antar sel input (kiri/kanan/atas/bawah)
function keyNav(e){
  const k = e.key;
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)) return;
  const el = e.target;
  if(!el.dataset || el.dataset.m === undefined) return;
  e.preventDefault();
  const all = Array.from(document.querySelectorAll('#ukurBody input'));
  const idx = all.indexOf(el);
  if(idx<0) return;
  const COLS = 12;
  let target = -1;
  if(k==='ArrowLeft'  && (idx % COLS) > 0)       target = idx-1;
  if(k==='ArrowRight' && (idx % COLS) < COLS-1)  target = idx+1;
  if(k==='ArrowUp'    && idx >= COLS)            target = idx-COLS;
  if(k==='ArrowDown'  && idx < all.length-COLS)  target = idx+COLS;
  if(target>=0 && target<all.length){
    const nx = all[target];
    nx.focus();
    try{ nx.select(); }catch(err){}
  }
}

async function loadExcelJS(){
  if(window.ExcelJS) return true;
  await new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = resolve; s.onerror = resolve;
    document.head.appendChild(s);
  });
  return !!window.ExcelJS;
}
async function downloadExcel(unitKode, unitNama){
  const ok = await loadExcelJS();
  if(!ok){ toast('Gagal memuat modul Excel — cek koneksi internet', false); return; }

  // kumpulkan record yang dicentang
  const ids = [...document.querySelectorAll('#riwayatList .uk-chk:checked')].map(c=>c.dataset.id);
  const unitId = DB.units.find(x=>x.kode===unitKode)?.id;
  let list = DB.measurements.filter(r=>r.unitId===unitId);
  if(ids.length) list = list.filter(r=>ids.includes(r.id));
  if(!list.length){ toast('Centang dulu data yang mau di-download (atau pakai Pilih semua)', false); return; }

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Monitoring Color - PT Astra Daihatsu Motor';

  const C = {
    dL:'FF8BC34A', da:'FFE91E63', db:'FF2196F3', dE:'FFFF9800',
    labBg:'FF3D4B3D', labFg:'FFFFFFFF',
    angBg:'FFF2F4EE',
    partBg:'FFEEF2EA',
    okBg:'FFE7F3E8', okFg:'FF1E6B24',
    ngBg:'FFFDEAEA', ngFg:'FFC1121F',
    tgt1:'FFE3F2FD', tgt2:'FF90CAF9', tgtFg:'FF0D47A1',
    border:'FFB7C2B7'
  };
  const thin = {style:'thin', color:{argb:C.border}};
  const BORDER = {top:thin,left:thin,bottom:thin,right:thin};
  const MET = ['dL','da','db','dE'];
  const MLBL = {dL:'\u0394L', da:'\u0394a', db:'\u0394b', dE:'\u0394E'};
  const ANG = ['25\u00b0','45\u00b0','75\u00b0'];

  // ---------- SHEET RINGKASAN ----------
  const ws0 = wb.addWorksheet('RINGKASAN');
  ws0.columns = [
    {header:'Tanggal', key:'t', width:14},{header:'Shift', key:'s', width:8},
    {header:'No Body', key:'n', width:14},{header:'Warna', key:'w', width:9},
    {header:'Area', key:'a', width:9},{header:'\u0394E Max', key:'m', width:10},
    {header:'Jumlah NG', key:'g', width:11},{header:'Status', key:'st', width:14}
  ];
  ws0.getRow(1).eachCell(c=>{ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0D3B66'}}; });
  list.forEach(r=>{
    const ngs = hitungNG(r);
    const row = ws0.addRow({t:r.tanggal, s:r.shift, n:r.noBody||'-', w:r.kode, a:r.area||'FULL',
      m: (typeof r.maxDE==='number'? r.maxDE : Math.max(...Object.values(r.rows).flatMap(v=>v.dE))),
      g: ngs.length, st: ngs.length? 'NG ('+ngs.length+' sel)' : 'Over All OK'});
    const stCell = row.getCell(8);
    stCell.font = {bold:true, color:{argb: ngs.length? 'FFC1121F':'FF1E6B24'}};
    stCell.fill = {type:'pattern',pattern:'solid',fgColor:{argb: ngs.length? 'FFFDEAEA':'FFE7F3E8'}};
  });

  // ---------- SHEET PER RECORD (tabel + GRAFIK di bawahnya, persis web) ----------
  for (let ri = 0; ri < list.length; ri++){
    const r = list[ri];
    const parts = Object.keys(r.rows).sort((a,b)=>PARTS8.findIndex(p=>p.toUpperCase()===a.toUpperCase()) - PARTS8.findIndex(p=>p.toUpperCase()===b.toUpperCase()));
    const safeName = `${ri+1}) ${r.kode} ${r.tanggal.slice(5).replace(/-/g,'.')}`.replace(/[*?:\\/\[\]]/g,'-');
    const ws = wb.addWorksheet(safeName, {views:[{state:'frozen', ySplit:2}]});

    // header baris 1: AREA CHECK (merge A1:A2) + metrik berwarna (merge 3 kolom)
    ws.mergeCells('A1:A2');
    const lab = ws.getCell('A1');
    lab.value = 'AREA CHECK';
    lab.font = {bold:true, color:{argb:C.labFg}, size:11};
    lab.fill = {type:'pattern',pattern:'solid',fgColor:{argb:C.labBg}};
    lab.alignment = {horizontal:'left', vertical:'middle'};
    let col = 2;
    MET.forEach(m=>{
      ws.mergeCells(1, col, 1, col+2);
      const c = ws.getCell(1, col);
      c.value = MLBL[m];
      c.font = {bold:true, color:{argb:'FFFFFFFF'}, size:12};
      c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:C[m]}};
      c.alignment = {horizontal:'center', vertical:'middle'};
      col += 3;
    });

    // header baris 2: sudut
    let c2 = 2;
    MET.forEach(()=>{
      ANG.forEach(a=>{
        const c = ws.getCell(2, c2++);
        c.value = a;
        c.font = {bold:true, color:{argb:'FF1F2A20'}, size:10};
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:C.angBg}};
        c.alignment = {horizontal:'center'};
      });
    });

    // baris data per part
    parts.forEach(p=>{
      const row = ws.addRow([p.toUpperCase()]);
      const pc = row.getCell(1);
      pc.font = {bold:true, color:{argb:'FF1F2A20'}, size:10};
      pc.fill = {type:'pattern',pattern:'solid',fgColor:{argb:C.partBg}};
      pc.alignment = {horizontal:'left'};
      let cc = 2;
      MET.forEach(m=>{
        for(let a=0;a<3;a++){
          const b = boundsOf(r.kode, m, a);
          const v = r.rows[p][m][a];
          const isNG = b && !isNaN(v) && (v<b[0]||v>b[1]);
          const cell = row.getCell(cc++);
          cell.value = v;
          cell.alignment = {horizontal:'center'};
          if(isNG){ cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.ngBg}}; cell.font={bold:true,color:{argb:C.ngFg}}; }
          else if(b){ cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:C.okBg}}; cell.font={color:{argb:C.okFg}}; }
        }
      });
    });

    // baris TARGET MAX UPPER ( + ) & LOWER ( - ) — gradient biru
    const tgtRow = (label, getVal, dEVal) => {
      const row = ws.addRow([label]);
      const pc = row.getCell(1);
      pc.font = {bold:true, color:{argb:C.tgtFg}, size:10};
      pc.alignment = {horizontal:'left'};
      pc.fill = {type:'gradient', gradient:'angle', degree:0,
        stops:[{position:0,color:{argb:C.tgt1}},{position:1,color:{argb:C.tgt2}}]};
      let cc = 2;
      MET.forEach(m=>{
        if(m==='dE'){
          const c = row.getCell(cc);
          c.value = dEVal; c.font={bold:true,color:{argb:C.tgtFg}};
          c.alignment={horizontal:'center'};
          ws.mergeCells(row.number, cc, row.number, cc+2);
          cc += 3;
          return;
        }
        for(let a=0;a<3;a++){
          const b = boundsOf(r.kode, m, a);
          const c = row.getCell(cc++);
          c.value = b ? getVal(b) : '';
          c.font = {bold:true,color:{argb:C.tgtFg}};
          c.alignment = {horizontal:'center'};
          c.fill = {type:'gradient', gradient:'angle', degree:0,
            stops:[{position:0,color:{argb:C.tgt1}},{position:1,color:{argb:C.tgt2}}]};
        }
      });
      row.eachCell(c=>{ c.border = BORDER; });
    };

    tgtRow('Target Max Upper ( + )', b=>b[1], DE_MAX);
    tgtRow('Target Max Lower ( - )', b=>b[0], '');

    // border semua sel data & header
    ws.eachRow({includeEmpty:false}, (row, rn)=>{
      if(rn<=2 || rn>ws.rowCount-2) {
        row.eachCell(c=>{ c.border = BORDER; });
      } else {
        row.eachCell(c=>{ c.border = BORDER; });
      }
    });

    // lebar kolom
    ws.getColumn(1).width = 18;
    for(let i=2;i<=13;i++) ws.getColumn(i).width = 9;

    // ---- GRAFIK di bawah tabel (SVG → PNG → insert) ----
    const svgStrs = MET.map(([m])=>chartSVG(r, m));
    const pngBufs = [];
    for(const svg of svgStrs){
      try{
        const pngDataUrl = await new Promise((res)=>{
          const cv = document.createElement('canvas');
          cv.width = 1360; cv.height = 624;
          const ctx = cv.getContext('2d');
          const img = new Image();
          const svgBlob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
          const url = URL.createObjectURL(svgBlob);
          img.onload = ()=>{
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
            ctx.drawImage(img, 0, 0, 1360, 624);
            URL.revokeObjectURL(url);
            cv.toBlob(b=>res(b), 'image/png');
          };
          img.onerror = ()=>{ URL.revokeObjectURL(url); res(null); };
          img.src = url;
        });
        pngBufs.push(pngDataUrl);
      }catch(e){ console.log('chart render error:', e); pngBufs.push(null); }
    }
    console.log('PNG buffers:', pngBufs.filter(Boolean).length, 'dari', svgStrs.length);
    console.log('PNG buffers siap:', pngBufs.filter(Boolean).length, '/', pngBufs.length);
    let imgRow = ws.rowCount + 2;
    for(let mi=0; mi<pngBufs.length; mi++){
      const blob = pngBufs[mi];
      if(!blob) continue;
      const ab = await blob.arrayBuffer();
      const pngId = wb.addImage({buffer: ab, extension:'png'});
      const gridCol = mi % 2 === 0 ? 1 : 8;
      const gridRow = imgRow + Math.floor(mi/2)*17;
      ws.addImage(pngId, {tl:{col:gridCol-1, row:gridRow-1}, ext:{width:480, height:220}});
    }
    ws.getRow(imgRow).height = 10;
    for(let pr=imgRow; pr<imgRow+34; pr++) ws.getRow(pr).height = 14;
  }

  wb.xlsx.writeBuffer().then(buf=>{
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Monitoring-${unitKode}-${list.length}data-${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast(`Excel ter-download ✓ (${list.length} data)`);
  });
}

function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function fmtTgl(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}

        return [0,1,2].map(()=>`<td>${b?b[0]:'\u2014'}</td>`).join('');
      }).join('')}</tr>

// ---------- GRAFIK garis vs target ADM (gaya laporan QC) ----------
function chartSVG(rec, m){
  const parts = Object.keys(rec.rows).sort((a,b)=>PARTS8.findIndex(p=>p.toUpperCase()===a.toUpperCase()) - PARTS8.findIndex(p=>p.toUpperCase()===b.toUpperCase()));
  const n = parts.length;
  const name = {dL:'\u0394L', da:'\u0394a', db:'\u0394b', dE:'\u0394E'}[m];
  const W=680, H=312, ml=52, mr=14, mt=20, mb=56;
  const iw=W-ml-mr, ih=H-mt-mb;
  let lo=Infinity, hi=-Infinity;
  parts.forEach(p=> rec.rows[p][m].forEach(v=>{ lo=Math.min(lo,+v); hi=Math.max(hi,+v); }));
  let tUp=null, tLo=null, tMax=null;
  if(m==='dE'){ tMax=DE_MAX; hi=Math.max(hi,tMax); lo=Math.min(lo,0); }
  else { const b=boundsOf(rec.kode,m,0); if(b){ tUp=b[1]; tLo=b[0]; hi=Math.max(hi,tUp); lo=Math.min(lo,tLo); } }
  const span=(hi-lo)||1; lo-=span*0.16; hi+=span*0.16;
  const X=i=> ml + (n===1? iw/2 : i*(iw/(n-1)));
  const Y=v=> mt + ih - (v-lo)/(hi-lo)*ih;
  let grid='';
  for(let g=0; g<=4; g++){
    const v=lo+(hi-lo)*g/4, yy=Y(v).toFixed(1);
    grid+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="#EEF2F7" stroke-width="1"/><text x="${ml-6}" y="${+yy+3}" font-size="8.4" fill="#94A3B8" text-anchor="end">${v.toFixed(Math.abs(v)>=10?0:2)}</text>`;
  }
  const y0v = Math.max(lo, Math.min(hi, 0));
  const zero = `<line x1="${ml}" x2="${W-mr}" y1="${Y(y0v).toFixed(1)}" y2="${Y(y0v).toFixed(1)}" stroke="#CBD5E1" stroke-width="1.2"/>`;
  let tl='';
  if(tUp!==null && tUp<=hi){ const yy=Y(tUp).toFixed(1);
    tl+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="#ff9800" stroke-width="2" stroke-dasharray="7 4"/><text x="${W-mr-3}" y="${yy-4}" font-size="8.6" font-weight="800" fill="#b35c00" text-anchor="end">TARGET MAX UPPER ( + ) ${+tUp}</text>`; }
  if(tLo!==null && tLo>=lo){ const yy=Y(tLo).toFixed(1);
    tl+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="#ff9800" stroke-width="2" stroke-dasharray="7 4"/><text x="${W-mr-3}" y="${+yy+11}" font-size="8.6" font-weight="800" fill="#b35c00" text-anchor="end">TARGET MAX LOWER ( - ) ${+tLo}</text>`; }
  if(tMax!==null){ const yy=Y(tMax).toFixed(1);
    tl+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="#E11D48" stroke-width="2" stroke-dasharray="8 4"/><text x="${W-mr-3}" y="${yy-4}" font-size="8.6" font-weight="800" fill="#E11D48" text-anchor="end">\u0394E TARGET MAX ${+tMax}</text>`; }
  let series='';
  // gaya Excel: 3 GARIS (25°/45°/75°) warna BERBEDA, menghubungkan antar part
  const ACOLORS = ['#1e88e5','#F5A623','#43a047'];   // biru 25°, kuning 45°, hijau 75°
  for(let a=0;a<3;a++){
    const pts = parts.map((p,i)=>({i, v:+rec.rows[p][m][a], p}));
    series += `<polyline points="${pts.map(pt=>`${X(pt.i).toFixed(1)},${Y(pt.v).toFixed(1)}`).join(' ')}" fill="none" stroke="${ACOLORS[a]}" stroke-width="2.2" opacity=".92"/>`;
    pts.forEach(pt=>{
      const b = boundsOf(rec.kode, m, a);
      const ng = b && !isNaN(pt.v) && (pt.v<b[0] || pt.v>b[1]);
      const cx=X(pt.i).toFixed(1), cy=Y(pt.v).toFixed(1);
      series += ng
        ? `<circle cx="${cx}" cy="${cy}" r="7" fill="rgba(225,29,72,.16)"/><circle cx="${cx}" cy="${cy}" r="4.4" fill="#E11D48" stroke="#fff" stroke-width="1.6"/>`
        : `<circle cx="${cx}" cy="${cy}" r="3.2" fill="${ACOLORS[a]}" stroke="#fff" stroke-width="1.2"/>`;
      series += `<text x="${cx}" y="${(+cy + (a===0?-8:12)).toFixed(1)}" font-size="8" font-weight="${ng?'800':'600'}" fill="${ng?'#E11D48':'#475569'}" text-anchor="middle">${pt.v}</text>`;
    });
  }
  const xl = parts.map((p,i)=>`<text transform="translate(${X(i).toFixed(1)},${H-mb+12}) rotate(-32)" font-size="9.6" fill="#1F2937" text-anchor="end" font-weight="600">${p}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="#F8FAFC"/>
    <text x="${ml}" y="13" font-size="12" font-weight="800" fill="#0F172A">${name} <tspan fill="#94A3B8" font-weight="600">\u2014 Trend Color (per area)</tspan></text>
    ${grid}${zero}${tl}${series}${xl}</svg>`;
}
function chartHTML(rec){
  const lg = `<div class="lg">
    <span><i style="background:#1e88e5"></i>25°</span>
    <span><i style="background:#F5A623"></i>45°</span>
    <span><i style="background:#43a047"></i>75°</span>
    <span><i style="background:#E11D48"></i>NG</span>
    <span><i style="background:#ff9800"></i>Target Max</span>
  </div>`;
  return `<div class="chart-grid">${METRICS.map(([m,l])=>`<div class="chart-cell">${chartSVG(rec,m)}${lg}</div>`).join('')}</div>`;
}

    <div class="ukur-head">
      <h2 class="sect">📈 Riwayat Pengukuran (${list.length})</h2>
      <label class="uk-all"><input type="checkbox" id="ukAll" onchange="toggleAllChecks(this)"> Pilih semua</label>
      <button class="dl-btn" onclick="downloadExcel('${uMeta?uMeta.kode:''}','${esc(uMeta?uMeta.nama:'')}')">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        DOWNLOAD THIS FILE
      </button>
    </div>
    <div class="ukur-filter">Filter:
      <select id="ukurFilterSel" onchange="setUkurFilter('${unitId}')">
        <option value="">Semua warna (${list.length})</option>
        ${kodes.map(k=>`<option ${k===ukurFilter?'selected':''}>${esc(k)}</option>`).join('')}
      </select>
      <select id="ukurBulanSel" onchange="setUkurFilter('${unitId}')">
        <option value="">Semua bulan</option>
        ${bulans.map(b=>`<option value="${b}" ${b===ukurBulan?'selected':''}>${bulanLabel(b)}</option>`).join('')}
      </select>
    </div>
    <div id="riwayatList">${riwayatList(unitId, ukurFilter, ukurBulan)}</div>`;
}

async function delUkur(id){
  if(!requireAdmin()) return;
  if(delArm !== id){
    delArm = id;
    toast('Klik sekali lagi untuk hapus data ukur ini', false);
    setTimeout(()=>{ if(delArm===id) delArm=null; }, 2600);
    return;
  }
  try{
    const j = await api('DELETE','/api/measurements/'+id);
    DB = j.db;
    delArm = null;
    render();
    toast('Data ukur dihapus');
  }catch(e){ toast(e.message || 'Gagal hapus', false); }
}


// ---------- START ----------
async function api(method, url, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: body!==undefined ? JSON.stringify(body) : undefined});
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
async function init(){
  try{
    const j = await api('GET','/api/bootstrap');
    SESSION = j.user; DB = j.db;
  }catch(e){ SESSION = null; DB = null; }
  render();
}
init();
</script>
